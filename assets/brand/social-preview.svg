<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Bastión VPN social preview</title><desc id="desc">Bastión VPN isolates customer networks behind a controlled access plane.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#075985"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e3a5f" opacity=".55"/></pattern></defs>
  <rect width="1280" height="640" rx="32" fill="url(#bg)"/><rect width="1280" height="640" rx="32" fill="url(#grid)"/>
  <text x="84" y="130" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="68" font-weight="750">Bastión <tspan fill="#67e8f9">VPN</tspan></text>
  <text x="88" y="184" fill="#bae6fd" font-family="Inter,Segoe UI,sans-serif" font-size="25">Isolated remote access for many customer networks.</text>
  <g fill="#0f172a" stroke="#22d3ee" stroke-width="3"><rect x="88" y="300" width="220" height="100" rx="16"/><rect x="390" y="300" width="220" height="100" rx="16"/><rect x="692" y="248" width="220" height="100" rx="16"/><rect x="692" y="390" width="220" height="100" rx="16"/><rect x="994" y="248" width="200" height="100" rx="16"/><rect x="994" y="390" width="200" height="100" rx="16"/></g>
  <g fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" text-anchor="middle"><text x="198" y="342" font-size="22">Operator</text><text x="198" y="370" fill="#94a3b8" font-size="15">browser / TCP client</text><text x="500" y="342" font-size="22">Access edge</text><text x="500" y="370" fill="#94a3b8" font-size="15">Caddy + HAProxy</text><text x="802" y="290" font-size="20">VPN A</text><text x="802" y="318" fill="#94a3b8" font-size="15">namespace A</text><text x="802" y="432" font-size="20">VPN B</text><text x="802" y="460" fill="#94a3b8" font-size="15">namespace B</text><text x="1094" y="290" font-size="20">Network A</text><text x="1094" y="432" font-size="20">Network B</text></g>
  <g fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"><path d="M308 350h82M610 350h62M610 350l62-52M610 350l62 90M912 298h82M912 440h82"/></g>
  <g fill="#22d3ee"><circle cx="308" cy="350" r="6"/><circle cx="390" cy="350" r="6"/><circle cx="610" cy="350" r="6"/><circle cx="692" cy="298" r="6"/><circle cx="692" cy="440" r="6"/><circle cx="912" cy="298" r="6"/><circle cx="912" cy="440" r="6"/><circle cx="994" cy="298" r="6"/><circle cx="994" cy="440" r="6"/></g>
</svg>
