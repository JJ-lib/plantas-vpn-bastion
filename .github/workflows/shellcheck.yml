name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck
      - name: Check shell scripts
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'scripts/*' | grep -v '^guacamole-server/')
          if ((${#files[@]} > 0)); then
            shellcheck "${files[@]}"
          fi
