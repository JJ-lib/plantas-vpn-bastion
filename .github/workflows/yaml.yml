name: YAML

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yamllint
        run: python -m pip install --disable-pip-version-check yamllint==1.35.1
      - name: Validate tracked YAML
        shell: bash
        run: yamllint -c .yamllint.yml $(git ls-files '*.yml' '*.yaml')
