<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Bastión VPN network flow</title><desc id="desc">Operator traffic crosses a controlled edge, a named proxy, and an isolated VPN namespace before reaching a customer target.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#082f49"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e3a5f" opacity=".55"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67e8f9"/></marker></defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/><rect width="1200" height="520" rx="24" fill="url(#grid)"/>
  <path d="M236 260h130M496 260h130M756 260h130" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle"><g fill="#0f172a" stroke="#94a3b8" stroke-width="2"><rect x="62" y="192" width="174" height="136" rx="16"/><rect x="366" y="192" width="130" height="136" rx="16"/><rect x="626" y="166" width="130" height="188" rx="16"/><rect x="886" y="192" width="250" height="136" rx="16"/></g><g fill="#f8fafc"><text x="149" y="242" font-size="24">Operator</text><text x="149" y="272" fill="#94a3b8" font-size="16">browser / client</text><text x="431" y="242" font-size="23">Caddy</text><text x="431" y="272" fill="#94a3b8" font-size="16">access edge</text><text x="691" y="226" font-size="23">HAProxy</text><text x="691" y="256" fill="#94a3b8" font-size="16">named frontend</text><text x="691" y="286" fill="#67e8f9" font-size="16">plant namespace</text><text x="1011" y="242" font-size="23">Customer target</text><text x="1011" y="272" fill="#94a3b8" font-size="16">HTTP / TCP service</text></g></g>
  <text x="600" y="92" fill="#e0f2fe" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700" text-anchor="middle">Explicit publication, isolated routes</text><text x="600" y="450" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,monospace" font-size="17" text-anchor="middle">No workstation-wide route table. No broad subnet exposure.</text>
</svg>
