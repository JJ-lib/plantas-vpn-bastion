<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Bastión VPN onboarding flow</title><desc id="desc">A VPN profile is validated, generated into a plant overlay, checked, and activated only after tunnel gates and a canary pass.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#0c4a6e"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e3a5f" opacity=".55"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67e8f9"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/><rect width="1200" height="560" rx="24" fill="url(#grid)"/>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle"><g fill="#0f172a" stroke="#22d3ee" stroke-width="2"><rect x="65" y="205" width="180" height="112" rx="16"/><rect x="300" y="205" width="180" height="112" rx="16"/><rect x="535" y="205" width="180" height="112" rx="16"/><rect x="770" y="205" width="180" height="112" rx="16"/><rect x="1000" y="205" width="135" height="112" rx="16"/></g><g fill="#f8fafc"><text x="155" y="250" font-size="20">Profile</text><text x="155" y="278" fill="#94a3b8" font-size="15">import or define</text><text x="390" y="250" font-size="20">Validate</text><text x="390" y="278" fill="#94a3b8" font-size="15">engine + fields</text><text x="625" y="250" font-size="20">Generate</text><text x="625" y="278" fill="#94a3b8" font-size="15">overlay + proxy</text><text x="860" y="250" font-size="20">Gate</text><text x="860" y="278" fill="#94a3b8" font-size="15">tunnel / SA / IF</text><text x="1067" y="250" font-size="20">Canary</text><text x="1067" y="278" fill="#94a3b8" font-size="15">then activate</text></g></g>
  <path d="M245 261h55M480 261h55M715 261h55M950 261h50" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M860 332v108H390v-108" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 8"/><text x="625" y="474" fill="#fecdd3" font-family="Inter,Segoe UI,sans-serif" font-size="17" text-anchor="middle">Failure stays a draft; production promotion is manual and fail-closed.</text>
  <text x="600" y="92" fill="#e0f2fe" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700" text-anchor="middle">Onboarding is a gated lifecycle, not a blind restart</text>
</svg>
