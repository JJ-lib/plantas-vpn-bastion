name: Markdown

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            SECURITY.md
            SUPPORT.md
            CHANGELOG.md
            ROADMAP.md
            docs/*.md
            assets/README.md
            examples/**/*.md
            .github/PULL_REQUEST_TEMPLATE.md
