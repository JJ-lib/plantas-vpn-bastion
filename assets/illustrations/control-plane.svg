<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Bastión VPN control plane</title><desc id="desc">A neutral dashboard illustration with live VPN cards, service paths, and a protected boundary.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#082f49"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12243c"/><stop offset="1" stop-color="#0b172a"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1e3a5f" opacity=".4"/></pattern></defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/><rect width="1200" height="650" rx="24" fill="url(#grid)"/>
  <rect x="54" y="52" width="1092" height="546" rx="18" fill="#071426" stroke="#1e4d70" stroke-width="2"/>
  <rect x="54" y="52" width="1092" height="62" rx="18" fill="#0f2238"/><circle cx="87" cy="83" r="10" fill="#22d3ee"/><text x="112" y="90" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Bastión VPN</text><text x="1006" y="89" fill="#67e8f9" font-family="ui-monospace,monospace" font-size="14">CONTROL PLANE</text>
  <rect x="78" y="138" width="230" height="426" rx="12" fill="#0b1b2f" stroke="#163b59"/><text x="105" y="180" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="14" letter-spacing="2">NAVIGATION</text><g font-family="Inter,Segoe UI,sans-serif" font-size="17"><rect x="98" y="210" width="190" height="44" rx="8" fill="#0e7490" opacity=".35"/><text x="118" y="238" fill="#e0f2fe">Overview</text><text x="118" y="294" fill="#94a3b8">VPNs</text><text x="118" y="350" fill="#94a3b8">Equipment</text><text x="118" y="406" fill="#94a3b8">Access policy</text><text x="118" y="462" fill="#94a3b8">Audit events</text></g>
  <text x="344" y="180" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">VPN overview</text><text x="344" y="208" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Health gates and published access</text>
  <g fill="url(#panel)" stroke="#1e4d70"><rect x="344" y="238" width="246" height="126" rx="12"/><rect x="610" y="238" width="246" height="126" rx="12"/><rect x="876" y="238" width="246" height="126" rx="12"/><rect x="344" y="388" width="778" height="144" rx="12"/></g>
